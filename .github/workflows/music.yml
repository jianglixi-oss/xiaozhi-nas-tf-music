name: Music checks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  nas-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: nas-music/requirements.txt
      - run: python -m pip install -r nas-music/requirements.txt
      - run: python -m unittest discover -s nas-music -p 'test_*.py' -v
      - run: python scripts/check_music_publication.py
